# Publica o app no GitHub Pages a cada push na main (repositório próprio "aprender-alemao").
# Pré-requisito único: Settings › Pages › Build and deployment › Source = "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validar-dados.mjs
      - run: node scripts/teste-unidade.mjs
      - run: node scripts/gerar-pwa.mjs --verificar

  publicar:
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site (só os arquivos do app)
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js data icons _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
